Name: Build Windows
on: workflow_dispatch
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with: { arch: x64 }
      - name: Build
        shell: cmd
        run: |
          cd /d "%GITHUB_WORKSPACE%\CPP\7zip\Bundles\Alone"
          nmake PLATFORM=x64
          if errorlevel 1 exit /b 1
          cd /d "%GITHUB_WORKSPACE%\CPP\7zip\Bundles\Format7zF"
          nmake PLATFORM=x64
          if errorlevel 1 exit /b 1
          cd /d "%GITHUB_WORKSPACE%\CPP\7zip\UI\GUI"
          nmake PLATFORM=x64
          if errorlevel 1 exit /b 1
          cd /d "%GITHUB_WORKSPACE%\CPP\7zip\Bundles\Fm"
          nmake PLATFORM=x64
          if errorlevel 1 exit /b 1
      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: |
            CPP/7zip/Bundles/Alone/**/7za.exe
            CPP/7zip/UI/GUI/**/7zG.exe
            CPP/7zip/Bundles/Fm/**/7zFM.exe
            CPP/7zip/Bundles/Format7zF/**/7z.dll
